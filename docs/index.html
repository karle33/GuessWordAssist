<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>猜字音｜四字猜词发音排除助手</title>
  <meta name="description" content="记录四字词语的声母、韵母和声调候选，排除不可能并固定已确认信息。" />
  <style>
    :root{--ink:#1e2925;--muted:#68746f;--paper:#f4f1e9;--card:#fffdf7;--green:#184f3b;--mint:#dce9df;--line:#d8d6cd;--red:#a94a3b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.4;background-image:radial-gradient(#1e292514 .65px,transparent .65px);background-size:6px 6px}main{position:relative;width:min(1180px,calc(100% - 40px));margin:auto;padding:48px 0 30px}.top{display:flex;justify-content:space-between;align-items:end;gap:30px;padding:0 4px 28px;border-bottom:1px solid #b9b9b1}.eyebrow{margin:0 0 8px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.18em}h1{margin:0;font:58px/1 Georgia,"STSong",serif;letter-spacing:.08em}.subtitle{margin:14px 0 0;color:var(--muted);font-size:14px}.attempts{display:grid;grid-template-columns:auto auto;align-items:center;gap:8px 14px;min-width:270px}.attempts strong{grid-row:1/3;color:var(--green);font:44px/1 Georgia,serif}.attempts strong small{color:var(--muted);font:600 14px Arial}.dots{display:flex;gap:5px}.dots i{width:8px;height:8px;border-radius:50%;background:#d2d2ca}.dots i.used{background:#d39353}.action{border:0;border-radius:8px;padding:8px 12px;background:var(--green);color:#fff;font-size:13px;font-weight:700;cursor:pointer}.panel{margin-top:24px;padding:25px 28px 28px;border:1px solid var(--line);border-radius:16px;background:#fffdf7e8;box-shadow:0 12px 35px #263a2b0a}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.heading div{display:flex;align-items:center;gap:12px}.heading h2{margin:0;font-size:21px}.heading p{margin:0;color:var(--muted);font-size:12px}.step{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--mint);color:var(--green);font-size:11px;font-weight:800}.sound-row{display:grid;grid-template-columns:48px 1fr;gap:14px;padding:11px 0;border-top:1px solid #ebe8df}.sound-row>strong{padding-top:7px;font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{min-width:38px;padding:6px 9px;border:1px solid #d6d5cd;border-radius:7px;background:#fff;color:#34413c;font-size:13px;cursor:pointer}.chip.off{border-color:transparent;background:#edeae2;color:#9a948b;text-decoration:line-through}.chip.off:before{content:"× ";color:var(--red);text-decoration:none}.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}.slot{min-width:0;padding:18px;border:1px solid #d8d7cf;border-radius:12px;background:#fff;position:relative}.slot:before{content:"";position:absolute;inset:0 0 auto;height:4px;border-radius:12px 12px 0 0;background:var(--green)}.slot-title{display:flex;align-items:baseline;gap:4px;margin-bottom:18px;color:var(--muted)}.slot-title b{color:var(--ink);font:700 27px Georgia,"STSong",serif}.slot-title span{font-size:12px}.field{display:block;margin-top:13px}.field-head{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px;font-weight:700}.field-head small{color:#8a928e;font-weight:400}select{display:block;width:100%;height:42px;border:1px solid #d7d8d3;border-radius:8px;background:#fafaf7;color:#5f6964;padding:0 10px;font-size:16px}select.is-confirmed{border-color:#9db7a5;background:#eef5ef;color:var(--green);font-weight:800}.syllable{margin-top:18px;padding-top:14px;border-top:1px dashed #dddcd5;color:var(--green);font:700 21px/1 Georgia,serif}.syllable span{color:#b06c38}.syllable sup{color:#7b668d;font-size:12px;margin-left:2px}footer{display:flex;justify-content:space-between;gap:16px;padding:20px 4px 0;color:var(--muted);font-size:12px}footer p{margin:0}footer b{color:var(--ink)}.reset{border:0;border-bottom:1px solid #c98d83;background:none;color:var(--red);white-space:nowrap;cursor:pointer}@media(max-width:850px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:48px}}@media(max-width:600px){main{width:min(100% - 24px,1180px);padding-top:28px}.top{display:block}.attempts{margin-top:24px}.panel{padding:20px 16px}.heading p{display:none}.slots{grid-template-columns:1fr}.sound-row{grid-template-columns:42px 1fr}footer{align-items:flex-start}}
  </style>
</head>
<body>
  <main>
    <header class="top"><div><p class="eyebrow">四字猜词 · 发音排除助手</p><h1>猜字音</h1><p class="subtitle">排除不可能，锁定已确认。所有进度会保存在这台设备上。</p></div><div class="attempts"><strong id="round">0<small>/10</small></strong><div class="dots" id="dots"></div><button class="action" id="addRound">记录一次猜测</button></div></header>
    <section class="panel"><div class="heading"><div><span class="step">01</span><h2>全局排除</h2></div><p>点选确定不会出现的发音元素，再点一次撤销</p></div><div id="exclusions"></div></section>
    <section class="panel"><div class="heading"><div><span class="step">02</span><h2>四字候选</h2></div><p>选中即固定；“待定”表示继续保留全部可用候选</p></div><div class="slots" id="slots"></div></section>
    <footer><p><b>小提示</b>　零声母用 ∅ 表示；轻声记作“轻”。</p><button class="reset" id="reset">清空本局</button></footer>
  </main>
  <script>
    const groups=[['initials','声母',['∅','b','p','m','f','d','t','n','l','g','k','h','j','q','x','zh','ch','sh','r','z','c','s','y','w']],['finals','韵母',['a','o','e','i','u','ü','ai','ei','ao','ou','an','en','ang','eng','ong','ia','ie','iao','iu','ian','in','iang','ing','iong','ua','uo','uai','ui','uan','un','uang','ueng','üe','üan','ün','er']],['tones','声调',['1','2','3','4','轻']]];
    const keys=['一','二','三','四'];let state={excluded:{initials:[],finals:[],tones:[]},slots:Array.from({length:4},()=>({initials:'',finals:'',tones:''})),round:0};
    try{const saved=JSON.parse(localStorage.getItem('caiziyin-pages'));if(saved?.excluded&&saved?.slots)state=saved}catch(e){}
    const save=()=>localStorage.setItem('caiziyin-pages',JSON.stringify(state));
    function render(){const ex=document.querySelector('#exclusions');ex.innerHTML='';groups.forEach(([kind,label,values])=>{const row=document.createElement('div');row.className='sound-row';row.innerHTML='<strong>'+label+'</strong><div class="chips"></div>';const box=row.lastChild;values.forEach(v=>{const b=document.createElement('button');b.className='chip'+(state.excluded[kind].includes(v)?' off':'');b.textContent=v;b.onclick=()=>{const a=state.excluded[kind];state.excluded[kind]=a.includes(v)?a.filter(x=>x!==v):[...a,v];save();render()};box.appendChild(b)});ex.appendChild(row)});const slots=document.querySelector('#slots');slots.innerHTML='';state.slots.forEach((slot,i)=>{const card=document.createElement('article');card.className='slot';card.innerHTML='<div class="slot-title"><span>第</span><b>'+keys[i]+'</b><span>字</span></div>';groups.forEach(([kind,label,values])=>{const options=values.filter(v=>!state.excluded[kind].includes(v));const field=document.createElement('label');field.className='field';field.innerHTML='<span class="field-head"><span>'+label+'</span><small>'+(slot[kind]?'已固定':options.length+' 个候选')+'</small></span>';const select=document.createElement('select');select.className=slot[kind]?'is-confirmed':'';select.innerHTML='<option value="">待定（'+options.length+'）</option>';if(slot[kind]&&!options.includes(slot[kind]))select.innerHTML+='<option value="'+slot[kind]+'">'+slot[kind]+'（已全局排除）</option>';options.forEach(v=>select.innerHTML+='<option value="'+v+'" '+(slot[kind]===v?'selected':'')+'>'+v+'</option>');select.value=slot[kind];select.onchange=e=>{slot[kind]=e.target.value;save();render()};field.appendChild(select);card.appendChild(field)});card.innerHTML+='<div class="syllable">'+(slot.initials||'·')+'<span>'+(slot.finals||'·')+'</span><sup>'+(slot.tones||'·')+'</sup></div>';slots.appendChild(card)});document.querySelector('#round').innerHTML=state.round+'<small>/10</small>';document.querySelector('#dots').innerHTML=Array.from({length:10},(_,i)=>'<i class="'+(i<state.round?'used':'')+'"></i>').join('');document.querySelector('#addRound').disabled=state.round===10}
    document.querySelector('#addRound').onclick=()=>{state.round=Math.min(10,state.round+1);save();render()};document.querySelector('#reset').onclick=()=>{if(confirm('确定清空所有排除项、固定项和次数吗？')){state={excluded:{initials:[],finals:[],tones:[]},slots:Array.from({length:4},()=>({initials:'',finals:'',tones:''})),round:0};save();render()}};render();
  </script>
</body>
</html>
